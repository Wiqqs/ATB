<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Craft of Worldwar</title>
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Georgia', serif; color: #fff; }
        
        /* Start-Sperre für Browser-Audio */
        #audio-unlocker { position: absolute; width: 100%; height: 100%; background: #0c0a08; z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        .screen { position: absolute; width: 100%; height: 100%; display: none; flex-direction: column; align-items: center; justify-content: center; background-size: cover; background-position: center; z-index: 10; }
        .active-screen { display: flex !important; }
        
        /* EXAKT AN DEINE DATEIEN ANGEPASST */
        #login-screen { background-image: url('login-bg.jpg'); background-color: #1a1008; }
        #char-screen { background-image: url('char-bg.png'); background-color: #15100e; flex-direction: row !important; justify-content: space-between; padding: 25px; }
        
        .login-box { background: rgba(12, 10, 8, 0.9); border: 2px solid #bd9626; box-shadow: 0 0 30px rgba(0, 0, 0, 0.9); padding: 35px; border-radius: 4px; width: 90%; max-width: 380px; text-align: center; }
        .login-title { color: #ffd700; font-size: 1.9rem; margin-bottom: 25px; letter-spacing: 1px; text-shadow: 2px 2px 4px #000; }
        .login-input { width: 100%; padding: 11px; margin-bottom: 18px; background: #000; border: 1px solid #4a3c24; color: #fff; font-size: 1rem; text-align: center; }
        
        .wow-btn { background: linear-gradient(#5a1a1a, #2b0505); border: 2px solid #bd9626; box-shadow: inset 0 0 5px #000, 0 3px 6px rgba(0,0,0,0.8); color: #ffd700; font-size: 1.05rem; font-weight: bold; padding: 10px 25px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
        .wow-btn:active { transform: scale(0.97); }
        
        .side-panel { width: 260px; height: 92%; background: rgba(12, 9, 7, 0.88); border: 2px solid #bd9626; padding: 20px; display: flex; flex-direction: column; z-index: 20; box-shadow: 0 0 15px rgba(0,0,0,0.7); }
        .center-panel { flex-grow: 1; height: 92%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; position: relative; }
        #char-3d-container { position: absolute; top: 0; left: 0; width: 100%; height: 85%; z-index: 15; cursor: grab; }
        #char-3d-container:active { cursor: grabbing; }
        .panel-title { color: #bd9626; font-size: 1.2rem; margin-bottom: 15px; border-bottom: 1px solid #4a3c24; padding-bottom: 5px; text-transform: uppercase; }
        .char-list-item { padding: 12px; background: linear-gradient(rgba(45, 33, 22, 0.6), rgba(20, 14, 9, 0.8)); border: 1px solid #bd9626; color: #fff; font-weight: bold; }
        .char-subtext { font-size: 0.8rem; color: #edd19c; margin-top: 3px; }
        
        #game-screen { position: absolute; width: 100%; height: 100%; display: none; z-index: 5; }
        #game-3d-container { width: 100%; height: 100%; position: absolute; top:0; left:0; z-index: 6; }
        .ui-overlay { position: absolute; z-index: 40; }
        .player-frame { top: 20px; left: 20px; background: rgba(10, 8, 6, 0.85); border: 2px solid #bd9626; padding: 12px; width: 230px; }
        .bar { height: 15px; margin-top: 5px; border: 1px solid #000; font-size: 11px; text-align: center; font-weight: bold; line-height: 13px;}
        .hp-bar { background: linear-gradient(#2e7d32, #1b5e20); width: 100%; color: #fff; }
        .energy-bar { background: linear-gradient(#1565c0, #0d47a1); width: 100%; color: #fff; }
        .esc-menu { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 260px; background: rgba(25, 20, 15, 0.95); border: 3px double #bd9626; padding: 25px 20px; z-index: 100; text-align: center; flex-direction: column; gap: 15px; }
        #damage-text { position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%); font-size: 3.5rem; font-weight: bold; color: #ff2222; text-shadow: 2px 2px 4px #000; pointer-events: none; z-index: 50; display: none; font-family: 'Impact', sans-serif; }
    </style>
</head>
<body>

    <!-- 0. SYSTEM-FREISCHALTUNG -->
    <div id="audio-unlocker">
        <h1 style="color: #ffd700; margin-bottom: 20px; font-size: 2.2rem; text-shadow: 0 0 10px #000;">Craft of Worldwar</h1>
        <button class="wow-btn" style="padding: 15px 40px; font-size: 1.2rem;" onclick="unlockGameEngine()">Spiel Starten</button>
    </div>

    <!-- AUDIO PLAYER -->
    <audio id="login-theme" loop src="fx_login_darkportal_loop.ogg"></audio>

    <!-- 1. LOGIN SCREEN -->
    <div id="login-screen" class="screen">
        <div class="login-box">
            <h1 class="login-title">Craft of Worldwar</h1>
            <input type="text" class="login-input" value="Wiqqs" readonly>
            <input type="password" class="login-input" value="••••••••" readonly>
            <button class="wow-btn" style="width: 100%;" onclick="showCharacterMenu()">Einloggen</button>
        </div>
    </div>

    <!-- 2. CHARAKTER MENÜ -->
    <div id="char-screen" class="screen">
        <div class="side-panel">
            <h3 class="panel-title">Realm-Status</h3>
            <p style="font-size: 0.9rem; color: #edd19c;">Klingenhügel<br><span style="color:#00ff00;">● Online</span></p>
        </div>
        <div class="center-panel">
            <div id="char-3d-container"></div>
            <button class="wow-btn" style="z-index:30; margin-bottom: 25px; width: 200px;" onclick="startGame()">Welt betreten</button>
        </div>
        <div class="side-panel">
            <h3 class="panel-title">Charaktere</h3>
            <div class="char-list-item">
                Wiqqs
                <div class="char-subtext">Stufe 1 Orc Krieger</div>
            </div>
        </div>
    </div>

    <!-- 3. MAIN GAMEPLAY SCREEN -->
    <div id="game-screen">
        <div id="game-3d-container"></div>
        <div id="damage-text"></div>
        <div class="ui-overlay player-frame">
            <div style="font-weight: bold; color: #ffd700; font-size: 1.05rem;">Wiqqs <span style="color:#fff; font-size:0.85rem;">(Stufe 1)</span></div>
            <div class="bar hp-bar" id="ui-player-hp">120 / 120</div>
            <div class="bar energy-bar">100 / 100</div>
        </div>
    </div>

    <!-- ESC SYSTEMMENÜ -->
    <div id="esc-menu" class="esc-menu">
        <div style="color: #bd9626; font-size: 1.3rem; font-weight: bold; text-transform: uppercase;">Systemmenü</div>
        <button class="wow-btn" style="width: 100%;" onclick="processLogout()">Ausloggen</button>
        <button class="wow-btn" style="width: 100%; background: linear-gradient(#3a3a3a, #1a1a1a); color: #ccc;" onclick="toggleEscMenu()">Zurück zum Spiel</button>
    </div>

    <script>
        let charScene, charCamera, charRenderer, charModel, charMixer;
        let gameScene, gameCamera, gameRenderer, playerModel, boarModel, floorMesh;
        let activeScreen = "loading";
        let isMouseDown = false, previousMousePosition = { x: 0 };
        let gameLoopRunning = false, combatTimer = null, isMovingToEnemy = false;

        function unlockGameEngine() {
            document.getElementById('audio-unlocker').style.display = 'none';
            document.getElementById('login-screen').classList.add('active-screen');
            activeScreen = "login";
            
            const music = document.getElementById('login-theme');
            music.play().catch(e => console.log("Audio blockiert oder Datei fehlt"));
        }

        window.addEventListener('keydown', function(e) {
            if (e.key === "Escape" || e.keyCode === 27) {
                if (activeScreen === "char" || activeScreen === "game") toggleEscMenu();
            }
        });
        function toggleEscMenu() {
            const menu = document.getElementById('esc-menu');
            menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
        }

        function processLogout() {
            document.getElementById('esc-menu').style.display = 'none';
            if (activeScreen === "game") {
                gameLoopRunning = false;
                if(combatTimer) clearInterval(combatTimer);
                document.getElementById('game-screen').style.display = 'none';
                document.getElementById('char-screen').classList.add('active-screen');
                activeScreen = "char";
            } else if (activeScreen === "char") {
                document.getElementById('char-screen').classList.remove('active-screen');
                document.getElementById('login-screen').classList.add('active-screen');
                activeScreen = "login";
                const music = document.getElementById('login-theme');
                music.play().catch(e => {});
            }
        }

        function showCharacterMenu() {
            document.getElementById('login-screen').classList.remove('active-screen');
            document.getElementById('char-screen').classList.add('active-screen');
            activeScreen = "char";
            initChar3D();
        }

        function startGame() {
            const music = document.getElementById('login-theme');
            music.pause();
            document.getElementById('char-screen').classList.remove('active-screen');
            document.getElementById('game-screen').style.display = 'block';
            activeScreen = "game";
            initMainGame3D();
        }

        function initChar3D() {
            const container = document.getElementById('char-3d-container');
            if(container.children.length > 0) return;

            charScene = new THREE.Scene();
            charCamera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
            charCamera.position.set(0, 1.1, 2.6);

            charRenderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            charRenderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(charRenderer.domElement);

            const light = new THREE.DirectionalLight(0xffffff, 1.5);
            light.position.set(2, 4, 2);
            charScene.add(light);
            charScene.add(new THREE.AmbientLight(0x777777));

            const loader = new THREE.GLTFLoader();
            loader.load('orcmale.glb', function(gltf) {
                charModel = gltf.scene;
                charModel.position.set(0, 0, 0);
                charScene.add(charModel);

                if(gltf.animations && gltf.animations.length > 0) {
                    charMixer = new THREE.AnimationMixer(charModel);
                    charMixer.clipAction(gltf.animations).play();
                }
            });

            container.addEventListener('mousedown', () => isMouseDown = true);
            window.addEventListener('mouseup', () => isMouseDown = false);
            container.addEventListener('mousemove', (e) => {
                if (isMouseDown && charModel) {
                    charModel.rotation.y += (e.clientX - previousMousePosition.x) * 0.01;
                }
                previousMousePosition = { x: e.clientX };
            });

            const clock = new THREE.Clock();
            function animateChar() {
                requestAnimationFrame(animateChar);
                if(charMixer) charMixer.update(clock.getDelta());
                charRenderer.render(charScene, charCamera);
            }
            animateChar();
        }

        function initMainGame3D() {
            const container = document.getElementById('game-3d-container');
            if(container.children.length > 0) {
                gameLoopRunning = true;
                startAutoCombatLoop();
                return;
            }

            gameScene = new THREE.Scene();
            gameScene.background = new THREE.Color(0x331a0e);
            gameScene.fog = new THREE.FogExp2(0x331a0e, 0.04);

            gameCamera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            gameCamera.position.set(0, 3.5, 6);

            gameRenderer = new THREE.WebGLRenderer({ antialias: true });
            gameRenderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(gameRenderer.domElement);

            const light = new THREE.DirectionalLight(0xffffff, 1.4);
            light.position.set(5, 10, 5);
            gameScene.add(light);
            gameScene.add(new THREE.AmbientLight(0x666666));

            const textureLoader = new THREE.TextureLoader();
            // KORRIGIERT auf deine durotardirt.png Datei
            textureLoader.load('durotardirt.png', function(texture) {
                texture.wrapS = THREE.RepeatWrapping;
                texture.wrapT = THREE.RepeatWrapping;
                texture.repeat.set(10, 100);
                const floorGeo = new THREE.PlaneGeometry(40, 1000);
                const floorMat = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.9 });
                floorMesh = new THREE.Mesh(floorGeo, floorMat);
                floorMesh.rotation.x = -Math.PI / 2;
                gameScene.add(floorMesh);
            });

            const loader = new THREE.GLTFLoader();
            loader.load('orcmale.glb', function(gltf) {
                playerModel = gltf.scene;
                playerModel.position.set(0, 0, 0);
                gameScene.add(playerModel);
                gameCamera.lookAt(playerModel.position);
            });

            loader.load('boar.glb', function(gltf) {
                boarModel = gltf.scene;
                resetBoarPosition();
                gameScene.add(boarModel);
            });

            gameLoopRunning = true;
            startAutoCombatLoop();

            function gameRenderLoop() {
                requestAnimationFrame(gameRenderLoop);
                if (gameLoopRunning) {
                    if (isMovingToEnemy && boarModel) {
                        if (boarModel.position.z < 1.4) {
                            boarModel.position.z += 0.16;
                            if(floorMesh) floorMesh.position.z += 0.08;
                        } else {
                            isMovingToEnemy = false;
                        }
                    }
                    gameRenderer.render(gameScene, gameCamera);
                }
            }
            gameRenderLoop();
        }

        function resetBoarPosition() {
            if(boarModel) {
                boarModel.position.set(0, 0, -25);
                boarModel.visible = true;
                isMovingToEnemy = true;
            }
        }

        function startAutoCombatLoop() {
            if(combatTimer) clearInterval(combatTimer);
            combatTimer = setInterval(() => {
                if(!gameLoopRunning || isMovingToEnemy || !boarModel) return;
                let dmg = Math.floor(Math.random() * 5) + 12;
                showDmgText("-" + dmg);
                clearInterval(combatTimer);
                setTimeout(() => {
                    if(boarModel) boarModel.visible = false;
                    setTimeout(() => {
                        resetBoarPosition();
                        startAutoCombatLoop();
                    }, 1200);
                }, 400);
            }, 1600);
        }

        function showDmgText(text) {
            const el = document.getElementById('damage-text');
            el.innerText = text; el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 600);
        }

        window.addEventListener('resize', () => {
            if (gameRenderer && gameCamera) {
                gameCamera.aspect = window.innerWidth / window.innerHeight;
                gameCamera.updateProjectionMatrix();
                gameRenderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
